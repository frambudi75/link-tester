<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Hexagon Base for Tab Visibility -->
  <rect width="64" height="64" rx="14" fill="#0b1120" />

  <!-- Glowing Outer Edge -->
  <path d="M32 8 L49 14 C49 29 42 45 32 54 C22 45 15 29 15 14 Z" 
        fill="url(#glowGrad)" 
        opacity="0.25" 
        filter="url(#cyberGlow)" />

  <!-- Main Cyber Shield -->
  <path d="M32 10 L47 15.5 C47 28.5 41 42.5 32 51 C23 42.5 17 28.5 17 15.5 Z" 
        fill="url(#shieldGrad)" 
        stroke="#60a5fa" 
        stroke-width="1.5" />

  <!-- Inner Radar / Shield Accent -->
  <path d="M32 17 L41 21 C41 30.5 37 40 32 46 C27 40 23 30.5 23 21 Z" 
        fill="#0f172a" 
        stroke="#38bdf8" 
        stroke-width="1.2" 
        opacity="0.95" />

  <!-- Central Pulse Node & Check Icon -->
  <polyline points="28,31 31,35 37,26" 
            fill="none" 
            stroke="#38bdf8" 
            stroke-width="2.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
            
  <circle cx="32" cy="18" r="1.5" fill="#67e8f9" />
</svg>
