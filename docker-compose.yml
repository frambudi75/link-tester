version: '3.8'

services:
  app:
    build: .
    container_name: link_tester_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=link_tester
      - DB_USER=link_tester_user
      - DB_PASS=link_tester_pass
    depends_on:
      - db
    volumes:
      - .:/var/www/html

  db:
    image: mysql:8.0
    container_name: link_tester_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: link_tester
      MYSQL_USER: link_tester_user
      MYSQL_PASSWORD: link_tester_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db_data:
